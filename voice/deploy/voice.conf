[Service]
Environment=VOICE_TTS=kokoro-multi-lang-v1_0
Environment=VOICE_TTS_SPEAKER=3
Environment=VOICE_TTS_THREADS=4
# ElevenLabs mode, switched on and off by voice, /voice/elevenlabs and /voice/local, or the popup.
# The gain brings this voice to Kokoro's level.
Environment=ELEVENLABS_VOICE_ID=56bWURjYFHyYyVf490Dp
Environment=ELEVENLABS_VOICE_NAME=Emma
Environment=ELEVENLABS_MODEL=eleven_flash_v2_5
Environment=ELEVENLABS_GAIN=0.47
# The longest a spoken question waits on one status lookup; anything later is said on its own.
Environment=VOICE_ASK_WAIT=30
