<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CryptoFort Login</title>
<style>
  :root { color-scheme: light dark; --fg: #111827; --muted: #6b7280; --bg: #ffffff; --line: #e5e7eb; --accent: #1f54c9; --bad: #9b1c1c; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f3f4f6; --muted: #9ca3af; --bg: #111827; --line: #374151; --accent: #6b93f0; --bad: #f87171; } }
  body { margin: 0; width: 320px; padding: 14px 16px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .origin { color: var(--muted); word-break: break-all; margin-bottom: 10px; }
  ul { margin: 0 0 10px; padding-left: 18px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.quiet { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  label { display: block; margin: 8px 0 2px; color: var(--muted); }
  input, textarea { box-sizing: border-box; width: 100%; font: inherit; padding: 5px 7px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  textarea { height: 44px; resize: vertical; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .note { color: var(--muted); margin-top: 8px; min-height: 1em; }
  .note.bad { color: var(--bad); }
  .row { display: flex; gap: 8px; }
</style>
</head>
<body>
  <h1>CryptoFort Login</h1>
  <div class="origin" id="origin">No page</div>
  <div id="saved"></div>
  <div class="row">
    <button id="fill" disabled>Fill Sign-In</button>
    <button id="toggle" class="quiet" disabled>Save a Login</button>
  </div>
  <form id="save" hidden>
    <hr>
    <label for="username">Username</label>
    <input id="username" autocomplete="off" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="off" required>
    <label for="totp">One-Time Code Seed (Optional)</label>
    <input id="totp" autocomplete="off" placeholder="Base32 seed or otpauth:// link">
    <label for="extra">Also Valid On (Optional)</label>
    <textarea id="extra" placeholder="One origin per line, such as https://*.example.com"></textarea>
    <div class="row" style="margin-top:10px"><button type="submit">Save to Vault</button></div>
  </form>
  <div class="note" id="note"></div>
  <script src="popup.js"></script>
</body>
</html>
